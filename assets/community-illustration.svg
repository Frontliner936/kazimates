    <circle cx="108" cy="234" r="15" fill="#ffefcf"/><path d="M102 234h12m-6-6v12" stroke="#c9801c" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M133 228h50M133 241h35" stroke="#c9d4ec" stroke-width="6" stroke-linecap="round"/>
