  <path d="M194 351c17-36 68-56 147-56s131 20 148 56l-28 69H221z" fill="url(#table)"/>
  <ellipse cx="341" cy="350" rx="148" ry="48" fill="#ffe0a4"/>
  <ellipse cx="341" cy="350" rx="126" ry="33" fill="#fff7e8"/>
  <!-- left person -->
