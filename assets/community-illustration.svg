    <path d="M141 414c7-72 31-111 88-111 45 0 74 30 85 84l-5 27z" fill="#ed8068"/>
    <path d="M182 309c9-39 38-58 75-58 36 0 61 23 61 61v20H177z" fill="#ffb547"/>
