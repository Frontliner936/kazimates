  <g fill="#3979e8"><circle cx="541" cy="354" r="7"/><circle cx="286" cy="70" r="7"/><circle cx="110" cy="326" r="5"/></g>
  <path d="M308 373c12 10 30 15 48 13" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".8"/>
