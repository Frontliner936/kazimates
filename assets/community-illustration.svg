    <circle cx="434" cy="218" r="4" fill="#20283d"/><circle cx="469" cy="218" r="4" fill="#20283d"/><path d="M438 239q14 12 28 0" fill="none" stroke="#512f27" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M386 330l-38 24" stroke="#70422f" stroke-width="18" stroke-linecap="round"/>
