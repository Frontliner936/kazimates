<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 560" role="img" aria-labelledby="title desc">
  <title id="title">KaziMates community connections</title>
  <desc id="desc">Three job seekers meet around a shared table, surrounded by profile and connection symbols.</desc>
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eaf0ff"/><stop offset="1" stop-color="#d7e4ff"/></linearGradient>
    <linearGradient id="table" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffcf79"/><stop offset="1" stop-color="#ffae45"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4f83f4"/><stop offset="1" stop-color="#2451c7"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#18366e" flood-opacity=".13"/></filter>
  </defs>
  <circle cx="340" cy="278" r="224" fill="url(#wash)"/>
  <circle cx="340" cy="278" r="185" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="5 11" opacity=".9"/>
  <path d="M105 372c42-49 84-56 124-23m222-166c48-22 83-10 117 27" fill="none" stroke="#9bb4f0" stroke-width="4" stroke-linecap="round"/>
