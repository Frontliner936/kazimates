    <circle cx="421" cy="111" r="17" fill="#e8efff"/><path d="M414 111l5 5 10-12" fill="none" stroke="#2459d3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M450 105h85M450 119h62" stroke="#d8dfed" stroke-width="7" stroke-linecap="round"/>
    <rect x="406" y="145" width="137" height="23" rx="11.5" fill="#eef3ff"/><circle cx="420" cy="156.5" r="6" fill="#ffb547"/><path d="M433 157h91" stroke="#91a9e8" stroke-width="5" stroke-linecap="round"/>
  </g>
  <g filter="url(#shadow)">
